name: 再生回数の更新

on:
  schedule:
    - cron: "23 18 * * *"   # 毎日 3:23（日本時間）
  workflow_dispatch:        # Actions の画面から手動でも実行できる

permissions:
  contents: write

concurrency:
  group: update-views
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 再生回数を取得
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/update_views.py
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/views.tsv
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "再生回数を更新"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
