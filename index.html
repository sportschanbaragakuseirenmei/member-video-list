<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>メンバー動画検索｜スポーツチャンバラ</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--fg:#1b2433;--muted:#5f6b7c;--line:#d5dbe3;--accent:#1f3a5f;--hit:#fff1b8}
@media (prefers-color-scheme:dark){:root{--bg:#11161e;--panel:#18202b;--fg:#e4e9f0;--muted:#9aa6b6;--line:#2f3a49;--accent:#7fa8de;--hit:#5a4a10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.5}
header{background:var(--accent);color:#fff;padding:18px 16px 14px}
@media (prefers-color-scheme:dark){header{background:#1f3a5f}}
header h1{margin:0;font-size:1.3rem;letter-spacing:.05em}
header p{margin:4px 0 0;font-size:.82rem;opacity:.85}
main{max-width:900px;margin:0 auto;padding:16px}
.search{position:sticky;top:0;background:var(--bg);padding:8px 0 10px;z-index:2}
input[type=search]{width:100%;font-size:1.05rem;padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
input[type=search]:focus{outline:none;border-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:8px;font-size:.85rem;color:var(--muted)}
.opts select{font-size:.85rem;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
#count{margin-left:auto}
ul{list-style:none;margin:0;padding:0}
li{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:6px 0}
li a{display:flex;gap:12px;align-items:center;padding:10px 12px;color:inherit;text-decoration:none}
li a:hover{border-color:var(--accent)}
.t{flex:1;min-width:0;word-break:break-all}
.d{font-size:.78rem;color:var(--muted);white-space:nowrap}
mark{background:var(--hit);color:inherit;border-radius:2px}
#more[hidden]{display:none}
#more{display:block;margin:14px auto;padding:10px 22px;font-size:.95rem;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.note{font-size:.8rem;color:var(--muted);margin:18px 0}
.empty{padding:30px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>メンバー動画検索</h1>
  <p>スポーツチャンバラ YouTube チャンネルのメンバー限定動画を探せます（再生にはメンバー登録が必要です）</p>
</header>
<main>
  <div class="search">
    <input id="q" type="search" placeholder="選手名・大学・種目・決まり手など（スペースで区切ると絞り込み）" autocomplete="off">
    <div class="opts">
      <label>並び順
        <select id="sort"><option value="new">新しい順</option><option value="old">古い順</option><option value="title">タイトル順</option></select>
      </label>
      <label>年
        <select id="year"><option value="">すべて</option></select>
      </label>
      <span id="count">読み込み中…</span>
    </div>
  </div>
  <ul id="list"></ul>
  <button id="more" hidden>さらに表示</button>
  <p class="note">例：「村田 扇面」「女子長剣フリー 決勝」「新人 二刀 決勝」。全角・半角、カタカナ・ひらがなの違いは区別しません。<br>最終更新：<span id="upd">-</span></p>
</main>
<script>
const PAGE=100;let all=[],hits=[],shown=0;
const $=id=>document.getElementById(id);
// 全角英数→半角、ひらがな→カタカナ、小文字化、旧字体の揺れを吸収
const norm=s=>s.normalize('NFKC').toLowerCase()
  .replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60))
  .replace(/[髙]/g,'高').replace(/[﨑]/g,'崎').replace(/[　\s]+/g,' ');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hl(title,terms){
  let h=esc(title);
  for(const t of terms){ if(!t)continue;
    // 正規化前の文字列で一致位置を探すのは難しいので、そのままの語で強調（一致しない場合は強調なし）
    const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    h=h.replace(re,m=>`<mark>${m}</mark>`);
  }
  return h;
}
function render(reset){
  const ul=$('list');
  if(reset){ul.innerHTML='';shown=0}
  const terms=$('q').value.trim().split(/[\s　]+/).filter(Boolean);
  const frag=document.createDocumentFragment();
  for(const v of hits.slice(shown,shown+PAGE)){
    const li=document.createElement('li');
    li.innerHTML=`<a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener"><span class="t">${hl(v.title,terms)}</span><span class="d">${v.date||''}</span></a>`;
    frag.appendChild(li);
  }
  ul.appendChild(frag);shown+=PAGE;
  $('more').hidden=shown>=hits.length;
  $('count').textContent=`${hits.length.toLocaleString()} 件 / 全 ${all.length.toLocaleString()} 件`;
  if(!hits.length) ul.innerHTML='<li class="empty" style="border:none;background:none">見つかりませんでした</li>';
}
function search(){
  const terms=norm($('q').value).split(' ').filter(Boolean);
  const y=$('year').value;
  hits=all.filter(v=>(!y||v.date.startsWith(y))&&terms.every(t=>v.n.includes(t)));
  const s=$('sort').value;
  if(s==='new')hits.sort((a,b)=>b.date.localeCompare(a.date));
  else if(s==='old')hits.sort((a,b)=>a.date.localeCompare(b.date));
  else hits.sort((a,b)=>a.title.localeCompare(b.title,'ja'));
  render(true);
  try{const u=new URL(location);u.searchParams.set('q',$('q').value);history.replaceState(null,'',u)}catch(e){}
}
let timer;$('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(search,150)});
$('sort').addEventListener('change',search);$('year').addEventListener('change',search);
$('more').addEventListener('click',()=>render(false));
fetch('data/videos.tsv',{cache:'no-cache'}).then(r=>r.text()).then(txt=>{
  // 形式：動画ID<TAB>公開日(YYYY-MM-DD)<TAB>タイトル
  all=txt.split('\n').filter(l=>l&&!l.startsWith('#')).map(l=>{const [id,date,...t]=l.split('\t');const title=t.join('\t');return{id,date:date||'',title,n:norm(title+' '+(date||''))}});
  const years=[...new Set(all.map(v=>v.date.slice(0,4)).filter(Boolean))].sort().reverse();
  for(const y of years){const o=document.createElement('option');o.value=o.textContent=y;$('year').appendChild(o)}
  const m=txt.match(/^# updated: (.+)$/m);$('upd').textContent=m?m[1]:'-';
  const q=new URL(location).searchParams.get('q');if(q)$('q').value=q;
  search();
}).catch(()=>{$('count').textContent='一覧を読み込めませんでした'});
</script>
</body>
</html>
